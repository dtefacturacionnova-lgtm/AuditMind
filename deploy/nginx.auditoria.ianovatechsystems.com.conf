# Nginx — auditoria.ianovatechsystems.com
# Web (Next.js):  127.0.0.1:3008
# API (NestJS):   127.0.0.1:4003  — bajo /api/
# ai-service:     127.0.0.1:8003  — NO expuesto (solo interno)
#
# Certbot añade los bloques SSL automáticamente.
# Para generar certificado (primera vez, como root):
#   certbot --nginx -d auditoria.ianovatechsystems.com

server {
    listen 80;
    listen [::]:80;
    server_name auditoria.ianovatechsystems.com;

    # Certbot colocará aquí la redirección a HTTPS

    # --- API NestJS ---
    location /api/ {
        proxy_pass         http://127.0.0.1:4003/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Uploads y respuestas grandes (PDFs, working papers)
        client_max_body_size 50M;
        proxy_read_timeout   120s;
    }

    # --- Next.js frontend ---
    location / {
        proxy_pass         http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
