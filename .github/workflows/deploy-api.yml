name: Deploy API → Railway

# Triggers after CI passes on main — only when API-relevant files change
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    # Only run if CI passed AND the triggering push was to main
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      # ── Railway deploy ──────────────────────────────────────────────────────
      # Requires secret: RAILWAY_TOKEN  (Settings → Tokens in Railway dashboard)
      # Requires secret: RAILWAY_SERVICE_ID  (from Railway service URL)
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy to Railway (API service)
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deployment summary
        run: |
          echo "### 🚀 API Deployed to Railway" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.event.workflow_run.head_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.event.workflow_run.head_branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** CI workflow (after all checks passed)" >> $GITHUB_STEP_SUMMARY
