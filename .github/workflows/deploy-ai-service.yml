name: Deploy AI Service → Railway

# Triggers after CI passes on main
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy AI Service to Railway
    runs-on: ubuntu-latest
    # Only run if CI passed AND the triggering push was to main
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - uses: actions/checkout@v4

      # ── Railway deploy ──────────────────────────────────────────────────────
      # Requires secret: RAILWAY_TOKEN        (Settings → Tokens in Railway)
      # Requires secret: RAILWAY_AI_SERVICE_ID (from Railway AI service URL)
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy AI Service to Railway
        run: railway up --service ${{ secrets.RAILWAY_AI_SERVICE_ID }} --detach
        working-directory: apps/ai-service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deployment summary
        run: |
          echo "### 🤖 AI Service Deployed to Railway" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.event.workflow_run.head_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.event.workflow_run.head_branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** CI workflow (after all checks passed)" >> $GITHUB_STEP_SUMMARY
