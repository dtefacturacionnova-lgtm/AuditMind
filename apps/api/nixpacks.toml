# Railway / Nixpacks — NestJS API
# Root Directory en Railway = apps/api
# Por lo tanto todos los comandos corren DESDE apps/api (ya no necesita "cd")

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm install --include=dev"]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "node dist/main"
