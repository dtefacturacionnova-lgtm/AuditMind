# Railway / Nixpacks — NestJS API
# Railway detecta Node.js automáticamente por package.json
# Este archivo fuerza Node 22 y configura el build

[phases.setup]
nixPkgs = ["nodejs_22", "npm-9_x"]

[phases.install]
cmds = ["npm install --include=dev"]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "node dist/main"
